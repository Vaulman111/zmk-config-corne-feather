name: Build ZMK firmware

on:
  workflow_dispatch:
  push:
    paths:
      - "config/**"
      - "build.yaml"
      - ".github/workflows/**"

jobs:
  fetch-matrix:
    runs-on: ubuntu-22.04
    name: Fetch Build Keyboards
    outputs:
      build_matrix: ${{ env.build_matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Build Matrix
        run: |
          echo "build_matrix=$(yq -oj -I0 'build.yaml')" >> $GITHUB_ENV

  build:
    runs-on: ubuntu-22.04
    needs: fetch-matrix
    name: Build
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.fetch-matrix.outputs.build_matrix) }}
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: sh -x {0}
        env:
          board: ${{ matrix.board }}
          shield: ${{ matrix.shield }}
          artifact_name: ${{ matrix.artifact-name }}
        run: |
          mkdir -p build
          cmake -B build -S /usr/share/zmk/app -GNinja \
            -DBOARD="$board" \
            -DSHIELD="$shield" \
            -DZMK_CONFIG="$GITHUB_WORKSPACE/config"
          ninja -C build
          mkdir -p artifacts
          cp build/zmk.uf2 artifacts/"$artifact_name".uf2

      - name: Archive
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.artifact-name }}
          path: artifacts

  merge:
    runs-on: ubuntu-latest
    needs: build
    name: Merge Output Artifacts
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: firmware
          pattern: artifact-*
          delete-merged: true
