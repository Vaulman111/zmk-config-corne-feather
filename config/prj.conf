# ZMK Config - Feather nRF52840 + Corne
CONFIG_BUILD_OUTPUT_UF2=y

# Battery (voltage divider on VDDH)
CONFIG_BATTERY_VDDH=y
CONFIG_BATTERY_VDDH_READ_PERIOD_MS=30000
CONFIG_NRF_BATTERY_VOLTAGE_DIVISOR=2

# LED status
CONFIG_NRF_LED=y
CONFIG_NRF_LED_PIN=13

# Disable USB/Console (saves RAM)
CONFIG_USB=n
CONFIG_CONSOLE=n

# Keypad debounce
CONFIG_ZMK_KSCAN_DEBOUNCE_PR_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_REL_MS=5

# Bluetooth HID
CONFIG_BT=y
CONFIG_BT_BAS=y
CONFIG_BT_HID=y
CONFIG_BT_HID_EP=y

# Power off / LEDs off
CONFIG_EXT_POWER=n
CONFIG_ZMK_INDICATORS=n
