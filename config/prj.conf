# ZMK Board compatibility override for nice_nano/nrf52840
# This board doesn't natively have ZMK compatibility but we enable it manually
CONFIG_ZMK_BOARD_COMPAT=y

# Use nice_nano board (same nRF52840 SoC as Feather)
# Our custom shield overlays provide the Corne GPIO matrix

# Build UF2 for Adafruit bootloader
CONFIG_BUILD_OUTPUT_UF2=y

# Battery (voltage divider on VDDH)
CONFIG_BATTERY_VDDH=y
CONFIG_BATTERY_VDDH_READ_PERIOD_MS=30000

# LED status
CONFIG_NRF_LED=y
CONFIG_NRF_LED_PIN=13

# Disable USB/Console (saves RAM)
CONFIG_USB=n
CONFIG_CONSOLE=n

# Keypad debounce
CONFIG_ZMK_KSCAN_DEBOUNCE_PR_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_REL_MS=5

# Bluetooth HID
CONFIG_BT=y
CONFIG_BT_BAS=y
CONFIG_BT_HID=y
CONFIG_BT_HID_EP=y

# Power off / LEDs off
CONFIG_EXT_POWER=n
CONFIG_ZMK_INDICATORS=n
CONFIG_ZMK_STUDIO=n
